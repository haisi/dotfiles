---
- name: Machine setup
  hosts: localhost
  become: true
  connection: local
  gather_facts: true

  vars:
    regular_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    # DMI chassis types that ansible's hardware facts report as laptop-ish;
    # gates everything laptop-only below so this same playbook stays a no-op
    # on a desktop machine.
    laptop_form_factors:
      - Laptop
      - Notebook
      - Portable
      - Sub Notebook

  tasks:
    - name: Install apt packages
      ansible.builtin.apt:
        name:
          - zsh
          - gnupg
          - fzf
          - bat
          - fd-find
          - ripgrep
          - starship
          - lf
          - unzip
          - chafa
          - ghostty
          - fontconfig
          - btop
          - htop
          - jq
          - tree
          - neovim
          - lazygit
          - build-essential
          - xserver-xorg
          - i3-wm
          - i3status
          - i3lock
          - rofi
        state: present
        update_cache: true

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ regular_user }}"
        shell: /usr/bin/zsh

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Determine dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    # --- eza (not in Ubuntu's default repos) ---
    - name: Add eza GPG key
      ansible.builtin.shell: >
        curl -fsSL https://raw.githubusercontent.com/eza-community/eza/main/deb.asc
        | gpg --yes --dearmor -o /etc/apt/keyrings/gierens.gpg
      args:
        creates: /etc/apt/keyrings/gierens.gpg

    - name: Add eza apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main"
        filename: gierens
        state: present

    - name: Install eza
      ansible.builtin.apt:
        name: eza
        state: present
        update_cache: true

    # --- GitHub CLI (not in Ubuntu's default repos) ---
    - name: Add GitHub CLI GPG key
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        mode: "0644"

    - name: Add GitHub CLI apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
        filename: github-cli
        state: present

    - name: Install GitHub CLI
      ansible.builtin.apt:
        name: gh
        state: present
        update_cache: true

    # --- Docker (not in Ubuntu's default repos) ---
    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Determine Ubuntu release codename
      ansible.builtin.command: lsb_release -cs
      register: ubuntu_codename
      changed_when: false

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ubuntu_codename.stdout }} stable"
        filename: docker
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ regular_user }}"
        groups: docker
        append: true

    # --- mise (not in Ubuntu's default repos) + JDK 25 ---
    - name: Add mise GPG key
      ansible.builtin.shell: >
        curl -fsSL https://mise.jdx.dev/gpg-key.pub
        | gpg --yes --dearmor -o /etc/apt/keyrings/mise-archive-keyring.gpg
      args:
        creates: /etc/apt/keyrings/mise-archive-keyring.gpg

    - name: Add mise apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/mise-archive-keyring.gpg arch={{ dpkg_arch.stdout }}] https://mise.jdx.dev/deb stable main"
        filename: mise
        state: present

    - name: Install mise
      ansible.builtin.apt:
        name: mise
        state: present
        update_cache: true

    - name: Check installed mise Java versions
      become: true
      become_user: "{{ regular_user }}"
      ansible.builtin.command: mise ls java
      register: mise_java_versions
      ignore_errors: true
      changed_when: false

    - name: Install JDK 25 and set as the global default via mise
      become: true
      become_user: "{{ regular_user }}"
      ansible.builtin.command: mise use --global java@25
      when: mise_java_versions is failed or '25' not in mise_java_versions.stdout

    - name: Check installed mise Node versions
      become: true
      become_user: "{{ regular_user }}"
      ansible.builtin.command: mise ls node
      register: mise_node_versions
      ignore_errors: true
      changed_when: false

    - name: Install Node LTS and set as the global default via mise
      become: true
      become_user: "{{ regular_user }}"
      ansible.builtin.command: mise use --global node@lts
      when: mise_node_versions is failed or mise_node_versions.stdout == ""

    # --- zoxide (installs to ~/.local/bin, has no apt package) ---
    - name: Check if zoxide is installed
      ansible.builtin.stat:
        path: "~{{ regular_user }}/.local/bin/zoxide"
      register: zoxide_bin

    - name: Install zoxide
      become: true
      become_user: "{{ regular_user }}"
      ansible.builtin.shell: curl -sSfL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | sh
      when: not zoxide_bin.stat.exists

    # --- herdr (installs to ~/.local/bin, has no apt package) ---
    - name: Check if herdr is installed
      ansible.builtin.stat:
        path: "~{{ regular_user }}/.local/bin/herdr"
      register: herdr_bin

    - name: Install herdr
      become: true
      become_user: "{{ regular_user }}"
      ansible.builtin.shell: curl -fsSL https://herdr.dev/install.sh | sh
      when: not herdr_bin.stat.exists

    # --- JetBrainsMono Nerd Font ---
    - name: Ensure user fonts directory exists
      ansible.builtin.file:
        path: "~{{ regular_user }}/.local/share/fonts"
        state: directory
        mode: "0755"
        owner: "{{ regular_user }}"

    - name: Check if JetBrainsMono Nerd Font is installed
      ansible.builtin.stat:
        path: "~{{ regular_user }}/.local/share/fonts/JetBrainsMonoNerdFontMono-Regular.ttf"
      register: jbmono_font

    - name: Download and extract JetBrainsMono Nerd Font
      ansible.builtin.unarchive:
        src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip
        dest: "~{{ regular_user }}/.local/share/fonts"
        remote_src: true
        owner: "{{ regular_user }}"
      when: not jbmono_font.stat.exists

    - name: Remove leftover downloaded font archive
      ansible.builtin.file:
        path: "~{{ regular_user }}/.local/share/fonts/JetBrainsMono.zip"
        state: absent

    - name: Refresh font cache
      become: true
      become_user: "{{ regular_user }}"
      ansible.builtin.command: fc-cache -f
      when: not jbmono_font.stat.exists

    # --- ibus keyboard layout ---
    # ibus-daemon starts a second or so after i3 on every login and applies
    # its own preload-engines' XKB layout when its first engine activates,
    # which races and overrides i3 config's `setxkbmap ch de_nodeadkeys`
    # exec line. Fix at the source instead of trying to out-race it.
    - name: Get regular user's UID
      ansible.builtin.command: id -u {{ regular_user }}
      register: regular_user_uid
      changed_when: false

    - name: Check current ibus preload-engines
      become: true
      become_user: "{{ regular_user }}"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ regular_user_uid.stdout }}/bus"
      ansible.builtin.command: gsettings get org.freedesktop.ibus.general preload-engines
      register: ibus_preload_engines
      changed_when: false
      failed_when: false

    - name: Set ibus preload-engines to Swiss German
      become: true
      become_user: "{{ regular_user }}"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ regular_user_uid.stdout }}/bus"
      ansible.builtin.command: gsettings set org.freedesktop.ibus.general preload-engines "['xkb:ch:de_nodeadkeys:deu']"
      when: ibus_preload_engines.stdout != "['xkb:ch:de_nodeadkeys:deu']"

    # --- Laptop-only: function key support (volume, display/keyboard
    # backlight). The matching i3 bindsyms in config.tmpl are themselves
    # gated on `hostnamectl chassis == laptop`, so this whole block and
    # those keybindings only ever land together on laptop hardware.
    - name: Install laptop function key tools
      ansible.builtin.apt:
        name:
          - brightnessctl
          - pipewire-audio
        state: present
        update_cache: true
      when: ansible_form_factor in laptop_form_factors

    - name: Add regular user to video group for unprivileged backlight control
      ansible.builtin.user:
        name: "{{ regular_user }}"
        groups: video
        append: true
      when: ansible_form_factor in laptop_form_factors

    # Debian/Ubuntu's brightnessctl package ships no udev rule, so
    # /sys/class/backlight/*/brightness and /sys/class/leds/*kbd_backlight/
    # brightness stay root:root 0644 — hand them to the video group instead.
    - name: Install udev rule for unprivileged backlight control
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/90-backlight.rules
        mode: "0644"
        content: |
          SUBSYSTEM=="backlight", ACTION=="add", RUN+="/bin/chgrp video $sys$devpath/brightness", RUN+="/bin/chmod g+w $sys$devpath/brightness"
          SUBSYSTEM=="leds", KERNEL=="*kbd_backlight", ACTION=="add", RUN+="/bin/chgrp video $sys$devpath/brightness", RUN+="/bin/chmod g+w $sys$devpath/brightness"
      register: backlight_udev_rule
      when: ansible_form_factor in laptop_form_factors

    - name: Reload udev rules and re-apply them to existing backlight/leds devices
      ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger --subsystem-match=backlight --subsystem-match=leds
      when: backlight_udev_rule is changed
